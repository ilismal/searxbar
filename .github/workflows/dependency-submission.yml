# GitHub no analiza los build.gradle.kts de forma estática: este workflow
# resuelve las dependencias y las envía al grafo de dependencias para que
# Dependabot pueda generar alertas de vulnerabilidades.
name: Dependency submission

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dependency-submission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/dependency-submission@v6
